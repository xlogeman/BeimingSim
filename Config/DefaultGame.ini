[/Script/UnrealEd.ProjectPackagingSettings]
; 打包时强制烘焙 AirSim 插件内容（运行时按名字加载，打包器无法自动发现引用）
; 注意：不以 / 开头的路径会被解析为相对于项目 Content 目录的路径，
; 因此必须用 ../Plugins/AirSim/Content；带 / 的包路径（如 /AirSim/Content）在此处无效
+DirectoriesToAlwaysCook=(Path="../Plugins/AirSim/Content")
; 机型热切换菜单在运行时软引用 /Game/UAV 下的无人机蓝图（扫描目录动态发现），
; 打包器无法自动发现引用，必须强制烘焙该目录，否则打包版里没有这些机型资产
+DirectoriesToAlwaysCook=(Path="UAV")
